  - generic [ref=e3]:
    - heading "HTTP Error 403.14 - Forbidden" [level=3] [ref=e4]
    - heading "O servidor Web está configurado para não listar o conteúdo deste diretório." [level=4] [ref=e5]
  - group [ref=e7]:
    - heading "Causas mais prováveis:" [level=4] [ref=e8]
    - list [ref=e9]:
      - listitem [ref=e10]: Um documento padrão não está configurado para a URL solicitada, e a pesquisa no diretório não está habilitada no servidor.
  - group [ref=e12]:
    - heading "Ações que você pode tentar:" [level=4] [ref=e13]
    - list [ref=e14]:
      - listitem [ref=e15]: Se não desejar habilitar a pesquisa no diretório, verifique se um documento padrão está configurado e se ele existe.
      - listitem [ref=e16]:
        - text: Habilite a pesquisa no diretório.
        - list [ref=e17]:
          - listitem [ref=e18]: Vá para o diretório de instalação do IIS Express.
          - listitem [ref=e19]: Execute appcmd set config /section:system.webServer/directoryBrowse /enabled:true para habilitar a pesquisa de diretório no nível do servidor.
          - listitem [ref=e20]: Execute appcmd set config ["NOME_DO_SITE"] /section:system.webServer/directoryBrowse /enabled:true para habilitar a pesquisa de diretório no nível do site.
      - listitem [ref=e21]: Verifique se o atributo configuration/system.webServer/directoryBrowse@enabled está definido como verdadeiro no arquivo de configuração do site ou aplicativo.
